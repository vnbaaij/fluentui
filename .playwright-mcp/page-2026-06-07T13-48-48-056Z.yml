              - generic [ref=f3e32]:
                - paragraph [ref=f3e33]: A heatmap is a 2D visualization that uses color to represent magnitude or intensity of values in the dataset. Generally, the color uses a sequential palette and corresponds to the value’s relative position within the represented ranges. This generally means larger values have darker colors.
                - heading "Layout" [level=3] [ref=f3e34]:
                  - link [ref=f3e35] [cursor=pointer]:
                    - /url: "#layout"
                  - text: Layout
                - paragraph [ref=f3e36]: Heatmaps are flexible in nature. The chart can support a minimum 2x2 grid through a maximum of 10x10 grid. The nodes should span and reflow with the overall width and height of your composition.
                - heading "Content" [level=3] [ref=f3e37]:
                  - link [ref=f3e38] [cursor=pointer]:
                    - /url: "#content"
                  - text: Content
                - paragraph [ref=f3e39]: The user has freedom to either choose a sequential palette or a range of colors that best represent the range of values. For example, AQI values of regions in a country could be represented in shades of green, orange and red based on prescribed health limits of the air quality.
                - heading "Customizing the chart" [level=3] [ref=f3e40]:
                  - link [ref=f3e41] [cursor=pointer]:
                    - /url: "#customizing-the-chart"
                  - text: Customizing the chart
                - heading "Defining Color scale" [level=4] [ref=f3e42]:
                  - link [ref=f3e43] [cursor=pointer]:
                    - /url: "#defining-color-scale"
                  - text: Defining Color scale
                - paragraph [ref=f3e44]:
                  - text: The color palette for a heat map chart is defined by a domain/range combination. The domain consists of values in the chart columns. It is an array of numbers. See
                  - code [ref=f3e45]: domainValuesForColorScale
                  - text: . The range is an array
                  - code [ref=f3e46]: rangeValuesForColorScale
                  - text: "of colors in hex format. The graph creates a mapping between each value from domain to range. For all values in the domain, an equivalent interpolation is drawn in the range of color scale. For eg: if the domain is [0,500,900] and range is [green, blue, red], then [0, 500] is mapped in the range [green, blue] and [500, 900] in the range [blue, red]."
                - heading "Data formatting" [level=4] [ref=f3e47]:
                  - link [ref=f3e48] [cursor=pointer]:
                    - /url: "#data-formatting"
                  - text: Data formatting
                - paragraph [ref=f3e49]: Use the following formatters based on the type of axis.
                - list [ref=f3e50]:
                  - listitem [ref=f3e51]:
                    - text: "For date x axis use:"
                    - code [ref=f3e52]: xAxisDateFormatString
                  - listitem [ref=f3e53]:
                    - text: "For date y axis use:"
                    - code [ref=f3e54]: yAxisDateFormatString
                  - listitem [ref=f3e55]:
                    - text: "For numeric x axis use:"
                    - code [ref=f3e56]: xAxisNumberFormatString
                  - listitem [ref=f3e57]:
                    - text: "For numeric y axis use:"
                    - code [ref=f3e58]: yAxisNumberFormatString
                  - listitem [ref=f3e59]:
                    - text: "For string x axis use:"
                    - code [ref=f3e60]: xAxisStringFormatter
                  - listitem [ref=f3e61]:
                    - text: "For string y axis use:"
                    - code [ref=f3e62]: yAxisStringFormatter
                - heading "Axis localization" [level=4] [ref=f3e63]:
                  - link [ref=f3e64] [cursor=pointer]:
                    - /url: "#axis-localization"
                  - text: Axis localization
                - paragraph [ref=f3e65]: The chart axes support 2 ways of localization.
                - list [ref=f3e66]:
                  - listitem [ref=f3e67]:
                    - text: JavaScript provided inbuilt localization for numeric and date axis. Specify the culture and
                    - code [ref=f3e68]: dateLocalizeOptions
                    - text: for date axis to define target localization. Refer the
                    - link "Javascript localization guide" [ref=f3e69] [cursor=pointer]:
                      - /url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toLocaleDateString
                    - text: for usage.
                  - listitem [ref=f3e70]:
                    - text: "Custom locale definition: The consumer of the library can specify a custom locale definition as supported by d3"
                    - link "like this" [ref=f3e71] [cursor=pointer]:
                      - /url: https://github.com/d3/d3-time-format/blob/main/locale/en-US.json
                    - text: . The date axis will use the date range and the multiformat specified in the definition to determine the correct labels to show in the ticks. For example - If the date range is in days, then the axis will show hourly ticks. If the date range spans across months, then the axis will show months in tick labels and so on. Specify the custom locale definition in the
                    - code [ref=f3e72]: timeFormatLocale
                    - text: prop. Refer to the Custom Locale Date Axis example in line chart for sample usage.
                - heading "Creating Date Objects For Chart Data" [level=3] [ref=f3e73]:
                  - link [ref=f3e74] [cursor=pointer]:
                    - /url: "#creating-date-objects-for-chart-data"
                  - text: Creating Date Objects For Chart Data
                - paragraph [ref=f3e75]:
                  - text: For instructions on how to create date objects to be passed as data points in the chart, see
                  - link "Creating Date Objects For Chart Data | FluentUI Charting Contrib Docsite" [ref=f3e76] [cursor=pointer]:
                    - /url: https://microsoft.github.io/fluentui-charting-contrib/docs/creating-date-objects-for-chart-data
                - heading "Do's" [level=3] [ref=f3e77]:
                  - link [ref=f3e78] [cursor=pointer]:
                    - /url: "#dos"
                  - text: Do's
                - list [ref=f3e79]:
                  - listitem [ref=f3e80]: Use sequential or divergent color palettes.
                - heading "Don'ts" [level=3] [ref=f3e81]:
                  - link [ref=f3e82] [cursor=pointer]:
                    - /url: "#donts"
                  - text: Don'ts
                - list [ref=f3e83]:
                  - listitem [ref=f3e84]: Heatmap should not be used as a table as the color coding is tied to data intensity.
